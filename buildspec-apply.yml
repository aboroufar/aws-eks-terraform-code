version: 0.2

env:
  variables:
    TF_VERSION: "1.10.5"
    AWS_DEFAULT_REGION: "eu-west-1"

phases:
  install:
    commands:
      - curl -sL -o tf.zip "https://releases.hashicorp.com/terraform/${TF_VERSION}/terraform_${TF_VERSION}_linux_amd64.zip"
      - unzip -o tf.zip -d /usr/local/bin/
      - yum install -y jq

  pre_build:
    commands:
      - terraform init -input=false

  build:
    commands:
      - terraform apply -auto-approve -input=false

  post_build:
    commands:
      - echo "Retrieving cluster registration outputs..."
      - EKS_ENDPOINT=$(terraform output -raw cluster_endpoint)
      - CA_DATA=$(terraform output -raw cluster_certificate_authority_data)
      - BEARER_TOKEN=$(terraform output -raw argocd_manager_token)
      - SECRET_ID=$(terraform output -raw argocd_secret_id)

      - echo "Constructing JSON payload for Secrets Manager..."
      - |
        SECRET_JSON=$(jq -n \
          --arg ep "$EKS_ENDPOINT" \
          --arg ca "$CA_DATA" \
          --arg tok "$BEARER_TOKEN" \
          '{server: $ep, caData: $ca, bearerToken: $tok}')

      - echo "Updating AWS Secrets Manager secret: ${SECRET_ID}"
      - aws secretsmanager put-secret-value \
          --secret-id "${SECRET_ID}" \
          --secret-string "${SECRET_JSON}" \
          --region "${AWS_DEFAULT_REGION}"

      - echo "Cluster registration payload successfully uploaded to Secrets Manager."
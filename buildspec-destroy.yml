version: 0.2

env:
  variables:
    TF_VERSION: "1.10.5"
    GITOPS_REPO: "git@github.com:aboroufar/gitops-workloads.git"
    GIT_USER_EMAIL: "codebuild-ci@example.com"
    GIT_USER_NAME: "AWS CodeBuild"

phases:
  install:
    commands:
      - curl -sL -o tf.zip "https://releases.hashicorp.com/terraform/${TF_VERSION}/terraform_${TF_VERSION}_linux_amd64.zip"
      - unzip -o tf.zip -d /usr/local/bin/
      - yum install -y jq git openssh-clients
  pre_build:
    commands:
      - terraform init -input=false
  build:
    commands:
      - terraform destroy -auto-approve -input=false
  post_build:
    commands:
      - echo "Setting up SSH credentials..."
      - mkdir -p ~/.ssh
      - chmod 700 ~/.ssh
      - aws secretsmanager get-secret-value --secret-id "gitops/deploy_key" --region eu-west-1 --output json | jq -r '.SecretString' > ~/.ssh/id_ed25519
      - chmod 600 ~/.ssh/id_ed25519
      - ssh-keyscan -t ed25519,rsa github.com >> ~/.ssh/known_hosts
      - chmod 644 ~/.ssh/known_hosts

      - echo "Cloning GitOps repository to remove deleted cluster registration..."
      - GIT_SSH_COMMAND="ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new" git clone "${GITOPS_REPO}" gitops-workloads
      - cd gitops-workloads

      - |
        if [ -d "clusters/aws-eks-prod" ]; then
          rm -rf clusters/aws-eks-prod
          git config user.email "${GIT_USER_EMAIL}"
          git config user.name "${GIT_USER_NAME}"
          git add -A
          if ! git diff-index --quiet HEAD; then
            git commit -m "chore(infra): deregister destroyed EKS cluster [skip ci]"
            GIT_SSH_COMMAND="ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes" git push origin main
            echo "Cluster deregistration pushed to GitOps."
          fi
        fi